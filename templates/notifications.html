{% extends "base.html" %}{% block title %}{{ _('Notifications') }}{% endblock %}
{% block content %}
<div class="row-between"><h1>{{ _('Notifications') }}</h1>
  <form method="post" action="{{ url_for('notifications_read_all') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn small">{{ _('Mark all as read') }}</button></form>
</div>
<div class="card">
  {% for n in notes %}
  <a class="note {{ 'unread' if not n.is_read }}" href="{{ url_for('ticket_detail', ticket_id=n.ticket_id) if n.ticket_id else (url_for('admin_users') if is_admin() else '#') }}">
    <span>{% if n.code %}<span class="code">{{ n.code }}</span> {% endif %}{{ n.message }}</span>
    <small class="muted">{{ n.created_at|dt }}</small>
  </a>
  {% else %}<p class="muted">{{ _('No notifications yet.') }}</p>{% endfor %}
</div>
{% endblock %}
