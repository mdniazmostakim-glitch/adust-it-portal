{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Change password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" required></label>
    <label>New password <input type="password" name="new" minlength="8" required></label>
    <label>Confirm new password <input type="password" name="confirm" minlength="8" required></label>
    <button class="btn primary full">Update password</button>
  </form>
</div>
{% endblock %}
