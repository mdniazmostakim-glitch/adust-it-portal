{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Sign in</h1>
  <p class="muted">Send work requests to the ADUST IT section and track their progress.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>University email or user ID
      <input name="identifier" required autofocus autocomplete="username" placeholder="name@{{ domain }} or employee ID" value="{{ request.form.identifier }}"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    {% if webmail %}<p class="hint">You can use your <strong>@{{ domain }} webmail password</strong>.</p>{% endif %}
    <button class="btn primary full">Sign in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
