# /etc/nginx/sites-available/adust-it-portal
server {
    listen 80;
    server_name it-portal.adust.edu.bd;   # or the server's IP address

    client_max_body_size 25M;

    # Optional second layer: block outside IPs at nginx too.
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
