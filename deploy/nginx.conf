# /etc/nginx/sites-available/adust-it-portal
server {
    listen 80;
    server_name _;                        # answers on the server's IP; put a name here if DNS has one

    client_max_body_size 25M;

    # Optional second layer: block outside IPs at nginx too.
    # allow 172.20.0.0/16;
    # allow 172.16.0.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
